<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly Cleaning Schedule</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #f4f4f4;
    }

    .back-link {
      margin-top: 20px;
      display: block;
      text-align: center;
    }

    .completed td {
      text-decoration: line-through;
      color: #aaa;
    }
  </style>
</head>

<body>

  <h1>Monthly Cleaning Schedule</h1>

  <table>
    <thead>
      <tr>
        <th>Week Ending</th>
        <th>Team</th>
      </tr>
    </thead>
    <tbody id="schedule-body">
      <!-- Rows are generated by the script below -->
    </tbody>
  </table>

  <a class="back-link" href="index.html">⬅ Back to Cleaning Checklist</a>

  <script type="module">
    import { schedule } from "./schedule-data.js";

    const tbody = document.getElementById("schedule-body");
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    for (const entry of schedule) {
      // Parse the YYYY-MM-DD date for comparison
      const rowDate = new Date(entry.date);

      // Reformat to DD-MM-YYYY for display
      const [year, month, day] = entry.date.split("-");
      const displayDate = `${day}-${month}-${year}`;

      // Build the row
      const row = document.createElement("tr");
      row.innerHTML = `<td>${displayDate}</td><td>${entry.team}</td>`;

      // Strike through if the week has already passed
      if (rowDate < today) {
        row.classList.add("completed");
      }

      tbody.appendChild(row);
    }
  </script>

</body>
</html>
