<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Items v3.0</title>

  <style>
       body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #f4f4f4;
    }

    .back-link {
      margin-top: 20px;
      display: block;
      text-align: center;
    }

    select {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
  }

    input[type="text"] {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    width: 180px;
  }

  .low-stock {
  background-color: #ffebee;
  color: #c62828;
  font-weight: bold;
}

    </style>
</head>
<body>

    <h1>Stock Items v3.0</h1>

<table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Quantity</th>
                <th>Comment</th>
            </tr>
        </thead>
    <tbody>

    <tr>
      <td>Toilet Paper</td>
      <td>
        <select data-id="toilet-paper" data-low="10">
          <option value="0">0</option>
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="40">40</option>
          <option value="50" selected>50</option>
        </select>
      </td>
      <td><input type="text" data-id="toilet-paper-comment" placeholder="No Comment"></td>
    </tr>

    <tr>
      <td>Paper Hand Towels</td>
      <td>
        <select data-id="paper-hand-towels" data-low="10">
          <option value="0">0</option>
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="30" selected>30</option>
          <option value="40">40</option>
          <option value="50">50</option>
        </select>
      </td>
      <td><input type="text" data-id="paper-hand-towels-comment" placeholder="No Comment"></td>
    </tr>

    <tr>
      <td>Womans Products</td>
      <td>
        <select data-id="womans-products" data-low="5">
          <option value="0">0</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20" selected>20</option>
          <option value="25">25</option>
          <option value="30">30</option>
        </select>
      </td>
      <td><input type="text" data-id="womans-products-comment" placeholder="No Comment"></td>
    </tr>

    <tr>
    <td>Bin Bags</td>
      <td>
        <select data-id="bin-bags" data-low="10">
          <option value="0">0</option>
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="40">40</option>
          <option  value="50" selected>50</option>
        </select>
      </td>
      <td><input type="text" data-id="bin-bags-comment" placeholder="No Comment"></td>
    </tr>

    <tr>
      <td>Toilet Duck</td>
      <td>
        <select data-id="toilet-duck" data-low="1">
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </td>
      <td><input type="text" data-id="toilet-duck-comment" placeholder="No Comment"></td>
    </tr>

    <tr>
      <td>Hand Soap</td>
      <td>
        <select data-id="hand-soap" data-low="1">
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </td>
      <td><input type="text"  data-id="hand-soap-comment" placeholder="Litres - estimated"></td>
    </tr>
    
    <tr>
      <td>Spray and Wipe</td>
      <td>
        <select data-id="spray-and-wipe" data-low="1">
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </td>
      <td><input type="text"  data-id="spray-and-wipe-comment" placeholder="Bottles"></td>
    </tr>
    </tbody>
</table>

  <a class="back-link" href="index.html">⬅ Back to Cleaning Checklist</a>

  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

  import { getAuth, signInAnonymously }
    from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    onSnapshot,
    getDoc,
    setDoc,
    updateDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAwyzLorHfENmCOVr3B1q4FhUn7sI565cI",
    authDomain: "hrb-cleaning-v2.firebaseapp.com",
    projectId: "hrb-cleaning-v2",
    storageBucket: "hrb-cleaning-v2.firebasestorage.app",
    messagingSenderId: "30392652789",
    appId: "1:30392652789:web:e4c0fc5202299cc4df46bc"
  };

  const app = initializeApp(firebaseConfig);

  // --- Auth ---
  const auth = getAuth(app);

  try {
    const cred = await signInAnonymously(auth);
    console.log("✅ Signed in. uid:", cred.user.uid);
  } catch (err) {
    console.error("Anonymous sign-in failed:", err.code, err.message);
    throw err;
  }

  // --- Firestore ---
  const db = getFirestore(app);

  // Stock saves here
  const stockRef = doc(db, "stock", "current");

  const quantityFields = Array.from(
    document.querySelectorAll("select[data-id]")
  );

  const commentFields = Array.from(
    document.querySelectorAll('input[type="text"][data-id]')
  );

  // Style change when quantities get low
function updateStockStyle(field) {
  const value = parseInt(field.value, 10);
  const lowThreshold = parseInt(field.dataset.low, 10);

  if (value <= lowThreshold) {
    field.classList.add("low-stock");
  } else {
    field.classList.remove("low-stock");
  }
}

  let applyingRemoteState = false;

  // Ensure the doc exists
  try {
    const existing = await getDoc(stockRef);

    if (!existing.exists()) {
      const initialData = {
        items: {},
        updatedAt: serverTimestamp()
      };

      for (const field of quantityFields) {
        initialData.items[field.dataset.id] = field.value;
      }

      for (const field of commentFields) {
        initialData.items[field.dataset.id] = field.value || "";
      }

      await setDoc(stockRef, initialData);
      console.log("📄 Created new stock doc");
    }
  } catch (err) {
    console.error("Initial Firestore read failed:", err.code, err.message);
  }

  // Firestore → UI
  onSnapshot(
    stockRef,
    (snap) => {
      if (!snap.exists()) return;

      const data = snap.data();
      const items = data.items || {};

      applyingRemoteState = true;

      for (const field of quantityFields) {
        const id = field.dataset.id;
        if (items[id] !== undefined) {
          field.value = items[id];
          updateStockStyle(field);
        }
      }

      for (const field of commentFields) {
        const id = field.dataset.id;
        if (items[id] !== undefined) {
          field.value = items[id];
        }
      }

      applyingRemoteState = false;
      console.log("📥 Applied Firestore stock state");
    },
    (err) => {
      console.error("onSnapshot error:", err.code, err.message);
    }
  );

  // UI → Firestore for dropdowns
for (const field of quantityFields) {
  field.addEventListener("change", async () => {
    if (applyingRemoteState) return;

    const id = field.dataset.id;

    updateStockStyle(field);

    try {
      await updateDoc(stockRef, {
        [`items.${id}`]: field.value,
        updatedAt: serverTimestamp()
      });
      console.log("📤 Saved quantity:", id, field.value);
    } catch (err) {
      console.error("Save failed:", err.code, err.message);
    }
  });
}

  // UI → Firestore for comments
  for (const field of commentFields) {
    field.addEventListener("input", async () => {
      if (applyingRemoteState) return;

      const id = field.dataset.id;

      try {
        await updateDoc(stockRef, {
          [`items.${id}`]: field.value,
          updatedAt: serverTimestamp()
        });
        console.log("📤 Saved comment:", id, field.value);
      } catch (err) {
        console.error("Save failed:", err.code, err.message);
      }
    });
  }

  for (const field of quantityFields) {
  updateStockStyle(field);
}
</script>

</body>
</html>
