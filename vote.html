<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Free Weekend Vote</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 { text-align: center; }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 20px;
    }

    select#team-picker {
      display: block;
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 24px;
      box-sizing: border-box;
    }

    .saturday-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }

    .saturday-date {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .checkbox-row {
      display: flex;
      gap: 28px;
    }

    .checkbox-row label {
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="checkbox"] {
      transform: scale(1.3);
    }

    .button-row {
      display: flex;
      justify-content: center;
      margin-top: 28px;
      margin-bottom: 8px;
    }

    .save-btn {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background-color: #2e7d32;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }

    .save-btn:hover { background-color: #1b5e20; }

    .save-btn:disabled {
      background-color: #aaa;
      cursor: default;
    }

    .status-banner {
      display: none;
      text-align: center;
      background-color: #e8f5e9;
      border: 1px solid #a5d6a7;
      border-radius: 8px;
      padding: 10px;
      margin-top: 16px;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <h1>Free Weekend Vote</h1>
  <p class="subtitle">Select your name and tick which Saturdays you are free (AM, PM, or both).</p>

  <select id="team-picker">
    <option value="">-- Select your name --</option>
  </select>

  <div id="saturdays-list"></div>

  <div class="button-row">
    <button id="submit-btn" class="save-btn">Submit Vote</button>
  </div>

  <div class="status-banner" id="status-banner">Vote saved!</div>

  <p style="text-align:center; margin-top:28px;">
    <a href="https://blueskyranger.github.io/HRBCleaningV2/vote-results.html" style="display:block; margin-bottom:10px;">
      View Results
    </a>
    <a href="https://blueskyranger.github.io/HRBCleaningV2/" style="display:block;">
      Back to Cleaning Checklist
    </a>
  </p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAwyzLorHfENmCOVr3B1q4FhUn7sI565cI",
      authDomain: "hrb-cleaning-v2.firebaseapp.com",
      projectId: "hrb-cleaning-v2",
      storageBucket: "hrb-cleaning-v2.firebasestorage.app",
      messagingSenderId: "30392652789",
      appId: "1:30392652789:web:e4c0fc5202299cc4df46bc"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    try {
      await signInAnonymously(auth);
    } catch (err) {
      console.error("Auth failed:", err.code, err.message);
    }

    const db = getFirestore(app);

    // Individual names for the vote dropdown
    const teams = ["Jarred", "Reuben", "Kevin", "Ursh", "Nathaniel", "Caietta"];

    const picker = document.getElementById("team-picker");
    for (const team of teams) {
      const opt = document.createElement("option");
      opt.value = team;
      opt.textContent = team;
      picker.appendChild(opt);
    }

    // Build list of the next 8 Saturdays as YYYY-MM-DD strings
    function getNextSaturdays(count) {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      const day = d.getDay();
      d.setDate(d.getDate() + (day === 6 ? 0 : 6 - day));
      const result = [];
      for (let i = 0; i < count; i++) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        result.push(y + "-" + m + "-" + dd);
        d.setDate(d.getDate() + 7);
      }
      return result;
    }

    const saturdays = getNextSaturdays(8);
    const container = document.getElementById("saturdays-list");

    for (const dateStr of saturdays) {
      const displayDate = new Date(dateStr + "T00:00:00").toLocaleDateString("en-AU", {
        weekday: "long", day: "numeric", month: "long", year: "numeric"
      });

      const card = document.createElement("div");
      card.className = "saturday-card";
      card.innerHTML =
        "<div class=\"saturday-date\">" + displayDate + "</div>" +
        "<div class=\"checkbox-row\">" +
          "<label><input type=\"checkbox\" data-date=\"" + dateStr + "\" data-slot=\"am\"> AM free</label>" +
          "<label><input type=\"checkbox\" data-date=\"" + dateStr + "\" data-slot=\"pm\"> PM free</label>" +
        "</div>";
      container.appendChild(card);
    }

    // Load an existing vote when the team changes
    async function loadVote(team) {
      try {
        const snap = await getDoc(doc(db, "votes", team));
        if (!snap.exists()) return;
        const saved = snap.data().saturdays || {};
        for (const cb of document.querySelectorAll("input[data-date]")) {
          const slot = saved[cb.dataset.date];
          cb.checked = !!(slot && slot[cb.dataset.slot]);
        }
      } catch (err) {
        console.error("Load failed:", err.code, err.message);
      }
    }

    picker.addEventListener("change", () => {
      for (const cb of document.querySelectorAll("input[data-date]")) cb.checked = false;
      if (picker.value) loadVote(picker.value);
    });

    // Save vote on submit
    document.getElementById("submit-btn").addEventListener("click", async () => {
      const team = picker.value;
      if (!team) {
        alert("Please select your team first.");
        return;
      }

      const satData = {};
      for (const cb of document.querySelectorAll("input[data-date]")) {
        const key = cb.dataset.date;
        if (!satData[key]) satData[key] = { am: false, pm: false };
        satData[key][cb.dataset.slot] = cb.checked;
      }

      const btn = document.getElementById("submit-btn");
      btn.disabled = true;

      try {
        await setDoc(doc(db, "votes", team), {
          team,
          submittedAt: serverTimestamp(),
          saturdays: satData
        });
        const banner = document.getElementById("status-banner");
        banner.style.display = "block";
        setTimeout(() => { banner.style.display = "none"; }, 3000);
      } catch (err) {
        console.error("Submit failed:", err.code, err.message);
        alert("Something went wrong. Please try again.");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
